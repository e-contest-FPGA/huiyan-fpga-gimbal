name: RTL simulation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  iverilog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run HDL checks
        run: python3 tools/simulate.py
